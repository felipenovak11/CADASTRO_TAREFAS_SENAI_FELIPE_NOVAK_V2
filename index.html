<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu painel de tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
   <div class="cartao-aplicacao">
    <header class="cabecalho-aplicacao">
        <img src="minha-foto.jpg">
        <h1>Minhas Tarefas ✨</h1>
        <button class="botao-icone" id="botao-alterar-tema">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>
    <div class="caixa-entrada">
        <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
        <button class="botao-principal" id="botao-adicionar">
            <i class="fa-solid fa-plus"></i>Adicionar
        </button>
        <button id="botao-limpar-tudo">Limpar Tudo</button>
    </div>
    <ul class="lista-tarefas" id="lista-tarefas">
        <!-- As tarefas serão inseridas dinamicamente via JavaScript -->
    </ul>
        <div class="caixa-tarefas-anteriores">
        <h3>Tarefas anteriores</h3>
        <ul id="lista-historico"></ul>
    </div>
    <footer class="rodape-aplicacao">
        <span id="contador-tarefas">0 tarefas na lista</span>
    </footer>
   </div>



   <script src="script.js"></script>
</body>
</html>
